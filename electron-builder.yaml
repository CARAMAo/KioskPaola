appId: com.kioskpaola.app
productName: KioskPaola
asar: true

forceCodeSigning: false

directories:
  output: release
  # buildResources: build

files:
  - dist/**
  - index.js
  - preload.js
  - package.json

# extraFiles:
#   - from: src/locales
#     to: translations
#     filter:
#       - "*.yaml"

#   - from: src/bus-pdfs
#     to: bus-pdfs
#     filter:
#       - "*.pdf"

#   - from: src/sponsors
#     to: sponsors

win:
  target:
    - nsis
    # - appx
  artifactName: Setup-${productName}-${version}.${ext}
  signAndEditExecutable: false
  # Configurazione Certificato (per firmare l'APPX)
  # signtoolOptions:
  #   certificateFile: KioskPaolaKey.pfx
  #   certificatePassword: password123

# Configurazione per l'installer NSIS
nsis:
  oneClick: false # Mostra la procedura guidata di installazione
  allowToChangeInstallationDirectory: true
  perMachine: true # installa per tutti gli utenti
  include: build/installer.nsh
  runAfterFinish: false
  warningsAsErrors: false
  allowElevation: true
# Disabilita publish automatico
publish:
  provider: generic
  url: ""
